name: Build and Push

# Runs on every push to main and on every semver tag. Tagging v1.1.0 is what
# produces the 1.1.0 image the Kubernetes manifests reference.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: identity-service

jobs:
  # ---------------------------------------------------------------------- #
  # Gate: never push an image built from code that fails its own tests.
  # ---------------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Pull requests are built (to prove the Dockerfile still works) but never
    # pushed — a fork PR must not be able to publish to our registry.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # buildx gives us layer caching and multi-arch builds.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # access token, not a password

      # Derives tags from the git ref: a push to main -> :main and :sha-abc1234,
      # a v1.1.0 tag -> :1.1.0, :1.1, :1 and :latest.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,format=long,prefix=sha-
          flags: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Bonus requirement: vulnerability scan. Fails the job on HIGH/CRITICAL
      # findings so a known-vulnerable base image can't reach the cluster.
      - name: Scan image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
